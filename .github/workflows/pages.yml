name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/bomfimdev/package-lock.json
      - name: Instalar e gerar o site
        working-directory: frontend/bomfimdev
        env:
          PUBLIC_URL: /Bomfimdev1
          REACT_APP_API_URL: https://bomfimdev.onrender.com
        run: |
          npm ci
          npm run build
          cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/bomfimdev/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
